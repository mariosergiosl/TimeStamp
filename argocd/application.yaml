apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sua-aplicacao
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/seu-usuario/seu-projeto.git
    targetRevision: main 
    path: sua-aplicacao 
    chart: sua-aplicacao
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true