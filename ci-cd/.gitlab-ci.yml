stages:
  - build
  - push 
  - package
  - publish

build_image:
  stage: build
  image: docker:latest 
  services:
    - docker:dind 
  script:
    - docker build -t $IMAGE_NAME . # Certifique-se de que IMAGE_NAME está definido nas variáveis de ambiente
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY # Certifique-se de que as variáveis de ambiente estão definidas

push_image:
  stage: push
  image: docker:latest 
  services:
    - docker:dind 
  script:
    - docker push $IMAGE_NAME

package:
  stage: package
  image: alpine/helm:latest 
  script:
    - helm package charts/devops-server -f charts/devops-server/values.yaml --app-version 0.1.0

publish:
  stage: publish
  image: alpine/helm:latest 
  script:
    - helm push devops-server-0.1.0.tgz oci://$CI_REGISTRY/desafio-devops # Substitua 'seu-projeto' pelo nome real do seu projeto
  artifacts:
    paths:
      - devops-server-0.1.0.tgz